[project]
name = "anomaly-detector"
# Releases are versioned by git tags, see .github/scripts/next-version.sh.
version = "0.0.0"
requires-python = "==3.10.*"
dependencies = [
    "operator-lib @ git+https://github.com/SENERGY-Platform/analytics-operator-lib-python@v1.11.0",
    "torch==2.14.1",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
